[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "pplus-physics-tools"
version = "0.1.0"

requires-python = ">=3.11"

dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["physics_tools*"]